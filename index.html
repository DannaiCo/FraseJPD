<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Nombre y frase</title>

    <link
      rel="stylesheet"
      href="https://use.typekit.net/vsp7vcb.css"
    />

    <style>
      :root {
        --ancho-lienzo: 2304;
        --alto-lienzo: 769;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fdefc8;
      }

      /* Contenedor que centra y escala el lienzo completo */
      #viewport {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      /* Lienzo de trabajo fijo: 2304 x 769 px */
      #lienzo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2304px;
        height: 769px;
        overflow: hidden;
        transform-origin: center center;
        background: #fdefc8;
      }

      /* ======================================================
         DOBLE REPRODUCTOR DE VIDEO
         ====================================================== */

      #contenedor-videos {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 2304px;
        height: 769px;
        overflow: hidden;
        background: #fdefc8;
      }

      .video-fondo {
        position: absolute;
        inset: 0;
        width: 2304px;
        height: 769px;
        object-fit: cover;

        opacity: 0;
        z-index: 0;

        /*
         * Fundido corto entre un video y el siguiente.
         */
        transition: opacity 180ms linear;

        /*
         * Optimización para cambios de capa.
         */
        will-change: opacity;
        transform: translateZ(0);
        backface-visibility: hidden;

        pointer-events: none;
      }

      .video-fondo.activo {
        opacity: 1;
      }

      /* Capa general para el contenido */
      #contenido {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      /* Nombre: medidas y posición originales */
      #nombre {
        color: #753806;
        position: absolute;
        align-content: center;
        left: 809px;
        bottom: 107px;
        width: 489px;
        height: 72px;
        font-size: 70px;
        font-family: "rival-sans", sans-serif;
        font-weight: 600;
        font-style: italic;
        line-height: 1.1;
        text-align: center;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }

      /* Caja de la frase: medidas y posición originales */
      #caja-frase {
        position: absolute;
        top: 74px;
        right: 985px;
        width: 531px;
        height: 509px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px 15px;
        text-align: center;
      }

      /* Frase: medidas originales */
      #frase {
        width: 100%;
        color: #fff;
        font-size: 95px;
        font-family: "jaf-domus", sans-serif;
        font-weight: 700;
        font-style: normal;
        line-height: 1.08;
        overflow-wrap: break-word;
        text-wrap: balance;
        text-align: center;
        text-shadow: 0 3px 11px rgba(0, 0, 0, 0.2);
      }

      #estado {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        padding: 12px 24px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 26px;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #estado.visible {
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <main id="viewport">
      <section id="lienzo">
        <!--
          Se utilizan dos reproductores superpuestos.

          Mientras uno muestra el video actual, el otro
          precarga el siguiente archivo.
        -->
        <div id="contenedor-videos">
          <video
            id="video-fondo-a"
            class="video-fondo"
            muted
            playsinline
            preload="auto"
            disablepictureinpicture
          ></video>

          <video
            id="video-fondo-b"
            class="video-fondo"
            muted
            playsinline
            preload="auto"
            disablepictureinpicture
          ></video>
        </div>

        <div id="contenido">
          <div id="caja-frase">
            <div id="frase">
              Cargando frase...
            </div>
          </div>

          <div id="nombre"></div>

          <div id="estado"></div>
        </div>
      </section>
    </main>

    <script>
      /*
       * ==========================================================
       * CONFIGURACIÓN
       * ==========================================================
       */

      const URL_APPS_SCRIPT =
        "https://script.google.com/macros/s/AKfycbyJ5JFUHJ58raugWjFHPIalheMR_H8Hmb4g74yij2oTrTaqk8uIAoiLe9O91ERR8JjQ/exec";
        
      const ANCHO_LIENZO = 2304;
      const ALTO_LIENZO = 769;

      /*
       * Cambia la frase localmente cada 5 segundos.
       */
       const INTERVALO_FRASES = 5000;

      /*
       * Actualiza la información de Google cada 5 minutos.
       */
      const INTERVALO_ACTUALIZACION_DATOS =
        5 * 60 * 1000;

      /*
       * Tiempo máximo para cada intento de carga de frases.
       */
      const TIEMPO_MAXIMO_DATOS = 15000;

      /*
       * Si Apps Script falla o devuelve una página HTML de Google,
       * se realizan varios intentos antes de abandonar la consulta.
       */
      const MAX_INTENTOS_DATOS = 3;

      const RETRASO_REINTENTO_DATOS = 2500;

      /*
       * Si todos los intentos fallan, se programa una recuperación
       * adicional sin borrar la información que ya está en pantalla.
       */
      const RETRASO_RECUPERACION_DATOS = 60 * 1000;

      /*
       * Guarda la última respuesta válida para reutilizarla cuando
       * la creatividad se cargue y Google esté temporalmente caído.
       */
      const CLAVE_CACHE_FRASES =
        "dooh-cache-frases-2304x769-v1";

      /*
       * Duración del fundido entre videos.
       *
       * Debe coincidir aproximadamente con la transición CSS.
       */
      const DURACION_FUNDIDO_MS = 120;

      /*
       * El cambio comienza antes de que termine el archivo.
       *
       * Esto evita alcanzar un posible último fotograma negro.
       */
      const MARGEN_CAMBIO_SEGUNDOS = 0.55;

      /*
       * Tiempo máximo para precargar un video.
       */
      const TIEMPO_MAXIMO_VIDEO = 10000;

      /*
       * Nombres exactos de los seis videos exportados.
       *
       * Deben encontrarse en la misma carpeta del HTML.
       */
      const VIDEOS_FONDO = [
        "fondo-00.mp4",
        "fondo-10.mp4",
        "fondo-20.mp4",
        "fondo-30.mp4",
        "fondo-40.mp4",
        "fondo-52.mp4"
      ];

      /*
       * Claves para conservar la secuencia aleatoria
       * aunque el reproductor recargue la creatividad.
       */
      const CLAVE_COLA_VIDEOS =
        "dooh-cola-videos-2304x769-v1";

      const CLAVE_ULTIMO_VIDEO =
        "dooh-ultimo-video-2304x769-v1";

      /*
       * ==========================================================
       * ELEMENTOS DEL HTML
       * ==========================================================
       */

      const lienzo =
        document.getElementById("lienzo");

      const nombreElemento =
        document.getElementById("nombre");

      const fraseElemento =
        document.getElementById("frase");

      const estadoElemento =
        document.getElementById("estado");

      const videosFondo = [
        document.getElementById(
          "video-fondo-a"
        ),
        document.getElementById(
          "video-fondo-b"
        )
      ];

      /*
       * ==========================================================
       * VARIABLES DE FRASES
       * ==========================================================
       */

      let registros = [];

      let ultimaClaveFrase = "";

      let cargaDatosEnCurso = false;

      let temporizadorRecuperacionDatos = null;

      /*
       * ==========================================================
       * VARIABLES DE VIDEO
       * ==========================================================
       */

      let indiceVideoActivo = 0;

      let sistemaVideosIniciado = false;

      let cambioVideoEnCurso = false;

      let siguienteVideoPreparado = false;

      let promesaPreparacionVideo = null;

      /*
       * Respaldo si el reproductor bloquea localStorage.
       */
      let colaVideosMemoria = [];

      let ultimoVideoMemoria = null;

      /*
       * ==========================================================
       * AJUSTE DEL LIENZO
       * ==========================================================
       */

      function ajustarLienzo() {
        const escalaX =
          window.innerWidth / ANCHO_LIENZO;

        const escalaY =
          window.innerHeight / ALTO_LIENZO;

        const escala =
          Math.min(escalaX, escalaY);

        lienzo.style.transform =
          `translate(-50%, -50%) scale(${escala})`;
      }

      /*
       * ==========================================================
       * MENSAJES DE ESTADO
       * ==========================================================
       */

      function mostrarEstado(mensaje) {
        estadoElemento.textContent =
          mensaje;

        estadoElemento.classList.add(
          "visible"
        );
      }

      function ocultarEstado() {
        estadoElemento.classList.remove(
          "visible"
        );
      }

      /*
       * ==========================================================
       * UTILIDADES
       * ==========================================================
       */

      function esperar(milisegundos) {
        return new Promise((resolve) => {
          setTimeout(resolve, milisegundos);
        });
      }

      /*
       * Mezcla aleatoriamente un arreglo.
       */
      function barajar(arreglo) {
        const resultado = [...arreglo];

        for (
          let indice = resultado.length - 1;
          indice > 0;
          indice--
        ) {
          const indiceAleatorio =
            Math.floor(
              Math.random() *
                (indice + 1)
            );

          [
            resultado[indice],
            resultado[indiceAleatorio]
          ] = [
            resultado[indiceAleatorio],
            resultado[indice]
          ];
        }

        return resultado;
      }

      /*
       * ==========================================================
       * FRASES ALEATORIAS
       * ==========================================================
       */

      function normalizarRegistro(registro) {
        return {
          nombre:
            registro.nombre ??
            registro.Nombre ??
            registro.NOMBRE ??
            "",

          frase:
            registro.frase ??
            registro.Frase ??
            registro.FRASE ??
            ""
        };
      }

      /*
       * Convierte y filtra la respuesta para conservar únicamente
       * registros con una frase válida.
       */
      function prepararRegistros(datos) {
        if (!Array.isArray(datos)) {
          return [];
        }

        return datos
          .map(normalizarRegistro)
          .filter((registro) => {
            return (
              typeof registro.frase ===
                "string" &&
              registro.frase.trim() !== ""
            );
          });
      }

      /*
       * Guarda localmente la última respuesta válida.
       */
      function guardarFrasesEnCache(
        registrosValidos
      ) {
        try {
          const contenido = {
            version: 1,
            guardadoEn: Date.now(),
            registros: registrosValidos
          };

          localStorage.setItem(
            CLAVE_CACHE_FRASES,
            JSON.stringify(contenido)
          );
        } catch (error) {
          console.warn(
            "No fue posible guardar las frases en caché:",
            error
          );
        }
      }

      /*
       * Recupera las últimas frases válidas guardadas.
       * También admite una lista directa por compatibilidad.
       */
      function cargarFrasesDesdeCache() {
        try {
          const contenido =
            localStorage.getItem(
              CLAVE_CACHE_FRASES
            );

          if (!contenido) {
            return [];
          }

          const datos = JSON.parse(contenido);

          const registrosGuardados =
            Array.isArray(datos)
              ? datos
              : datos?.registros;

          return prepararRegistros(
            registrosGuardados
          );
        } catch (error) {
          console.warn(
            "No fue posible leer las frases guardadas:",
            error
          );

          return [];
        }
      }

      /*
       * Programa una nueva consulta después de una falla total.
       * Solo permite un temporizador pendiente a la vez.
       */
      function programarRecuperacionDatos() {
        if (
          temporizadorRecuperacionDatos !==
          null
        ) {
          return;
        }

        temporizadorRecuperacionDatos =
          setTimeout(() => {
            temporizadorRecuperacionDatos =
              null;

            cargarDatos(false);
          }, RETRASO_RECUPERACION_DATOS);
      }

      function obtenerClaveRegistro(registro) {
        return [
          String(registro.nombre).trim(),
          String(registro.frase).trim()
        ].join("|||");
      }

      function mostrarRegistro(registro) {
        if (!registro) {
          nombreElemento.textContent = "";

          fraseElemento.textContent =
            "No hay frases aprobadas.";

          return;
        }

        nombreElemento.textContent =
          registro.nombre;

        fraseElemento.textContent =
          registro.frase;
      }

      /*
       * Selecciona una frase aleatoria evitando repetir
       * inmediatamente la misma.
       */
      function mostrarFraseAleatoria() {
        if (registros.length === 0) {
          return;
        }

        let candidatos =
          registros.filter(
            (registro) =>
              obtenerClaveRegistro(registro) !==
              ultimaClaveFrase
          );

        /*
         * Si solamente existe una frase, se permite repetirla.
         */
        if (candidatos.length === 0) {
          candidatos = registros;
        }

        const indiceAleatorio =
          Math.floor(
            Math.random() *
              candidatos.length
          );

        const registroSeleccionado =
          candidatos[indiceAleatorio];

        ultimaClaveFrase =
          obtenerClaveRegistro(
            registroSeleccionado
          );

        mostrarRegistro(
          registroSeleccionado
        );
      }

      /*
       * Ejecuta un intento individual contra Apps Script.
       * Lee primero como texto para detectar páginas HTML de
       * Google Drive que puedan llegar con estado HTTP 200.
       */
      async function consultarAppsScript(
        numeroIntento
      ) {
        const puedeCancelar =
          typeof AbortController !==
          "undefined";

        const controlador =
          puedeCancelar
            ? new AbortController()
            : null;

        const temporizador =
          controlador
            ? setTimeout(() => {
                controlador.abort();
              }, TIEMPO_MAXIMO_DATOS)
            : null;

        try {
          const separador =
            URL_APPS_SCRIPT.includes("?")
              ? "&"
              : "?";

          const urlConsulta =
            `${URL_APPS_SCRIPT}${separador}` +
            `t=${Date.now()}&intento=${numeroIntento}`;

          const configuracionFetch = {
            method: "GET",
            cache: "no-store",
            redirect: "follow",
            headers: {
              Accept: "application/json,text/plain,*/*"
            }
          };

          if (controlador) {
            configuracionFetch.signal =
              controlador.signal;
          }

          const respuesta =
            await fetch(
              urlConsulta,
              configuracionFetch
            );

          const tipoContenido =
            respuesta.headers
              .get("content-type")
              ?.toLowerCase() || "";

          const cuerpo =
            await respuesta.text();

          if (!respuesta.ok) {
            throw new Error(
              `Error HTTP ${respuesta.status}: ${respuesta.statusText}`
            );
          }

          const cuerpoLimpio =
            cuerpo.trim();

          if (!cuerpoLimpio) {
            throw new Error(
              "Apps Script respondió sin contenido."
            );
          }

          const pareceHtml =
            tipoContenido.includes(
              "text/html"
            ) ||
            /^<!doctype\s+html/i.test(
              cuerpoLimpio
            ) ||
            /^<html[\s>]/i.test(
              cuerpoLimpio
            );

          if (pareceHtml) {
            throw new Error(
              "Google devolvió una página HTML en lugar del JSON esperado."
            );
          }

          let datos;

          try {
            datos = JSON.parse(
              cuerpoLimpio
            );
          } catch (error) {
            throw new Error(
              "La respuesta recibida no contiene un JSON válido."
            );
          }

          if (!Array.isArray(datos)) {
            throw new Error(
              "La respuesta de Apps Script no es un arreglo JSON."
            );
          }

          return datos;
        } finally {
          if (temporizador !== null) {
            clearTimeout(temporizador);
          }
        }
      }

      /*
       * Realiza hasta tres intentos con una espera progresiva.
       */
      async function consultarDatosConReintentos() {
        let ultimoError = null;

        for (
          let intento = 1;
          intento <= MAX_INTENTOS_DATOS;
          intento++
        ) {
          try {
            return await consultarAppsScript(
              intento
            );
          } catch (error) {
            ultimoError = error;

            console.warn(
              `Intento ${intento} de ${MAX_INTENTOS_DATOS} fallido:`,
              error
            );

            if (
              intento < MAX_INTENTOS_DATOS
            ) {
              const esperaReintento =
                RETRASO_REINTENTO_DATOS *
                  intento +
                Math.floor(
                  Math.random() * 1000
                );

              await esperar(
                esperaReintento
              );
            }
          }
        }

        throw (
          ultimoError ||
          new Error(
            "No fue posible consultar Apps Script."
          )
        );
      }

      /*
       * Actualiza las frases desde Google.
       *
       * Si la consulta falla, conserva la última información válida
       * cargada desde memoria o desde localStorage. Nunca reemplaza
       * una frase funcional por el mensaje de error.
       */
      async function cargarDatos(
        esCargaInicial = false
      ) {
        if (cargaDatosEnCurso) {
          return;
        }

        cargaDatosEnCurso = true;

        if (
          esCargaInicial &&
          registros.length === 0
        ) {
          mostrarEstado(
            "Cargando información..."
          );
        }

        try {
          const datos =
            await consultarDatosConReintentos();

          const nuevosRegistros =
            prepararRegistros(datos);

          if (
            nuevosRegistros.length === 0
          ) {
            throw new Error(
              "Apps Script respondió sin frases válidas."
            );
          }

          registros = nuevosRegistros;

          guardarFrasesEnCache(
            nuevosRegistros
          );

          if (
            temporizadorRecuperacionDatos !==
            null
          ) {
            clearTimeout(
              temporizadorRecuperacionDatos
            );

            temporizadorRecuperacionDatos =
              null;
          }

          if (
            esCargaInicial ||
            ultimaClaveFrase === "" ||
            fraseElemento.textContent ===
              "Cargando frase..."
          ) {
            mostrarFraseAleatoria();
          }

          ocultarEstado();
        } catch (error) {
          console.error(
            "No fue posible actualizar los datos después de los reintentos:",
            error
          );

          /*
           * Si no había datos en memoria, intenta recuperar nuevamente
           * la última copia válida almacenada.
           */
          if (registros.length === 0) {
            const registrosCache =
              cargarFrasesDesdeCache();

            if (
              registrosCache.length > 0
            ) {
              registros = registrosCache;

              mostrarFraseAleatoria();

              ocultarEstado();
            } else {
              /*
               * No muestra "No fue posible cargar la información".
               * Deja un estado neutro mientras programa otro intento.
               */
              nombreElemento.textContent =
                "";

              fraseElemento.textContent =
                "Cargando frase...";

              mostrarEstado(
                "Conexión temporal. Reintentando..."
              );
            }
          }

          programarRecuperacionDatos();
        } finally {
          cargaDatosEnCurso = false;
        }
      }

      /*
       * ==========================================================
       * SECUENCIA ALEATORIA DE VIDEOS
       * ==========================================================
       */

      function leerColaVideos() {
        try {
          const valor =
            localStorage.getItem(
              CLAVE_COLA_VIDEOS
            );

          if (!valor) {
            return [...colaVideosMemoria];
          }

          const cola =
            JSON.parse(valor);

          return Array.isArray(cola)
            ? cola
            : [...colaVideosMemoria];
        } catch (error) {
          return [...colaVideosMemoria];
        }
      }

      function guardarColaVideos(cola) {
        colaVideosMemoria = [...cola];

        try {
          localStorage.setItem(
            CLAVE_COLA_VIDEOS,
            JSON.stringify(cola)
          );
        } catch (error) {
          console.warn(
            "No fue posible guardar la cola de videos."
          );
        }
      }

      function leerUltimoVideo() {
        try {
          const valor =
            localStorage.getItem(
              CLAVE_ULTIMO_VIDEO
            );

          return valor ||
            ultimoVideoMemoria;
        } catch (error) {
          return ultimoVideoMemoria;
        }
      }

      function guardarUltimoVideo(
        nombreVideo
      ) {
        ultimoVideoMemoria =
          nombreVideo;

        try {
          localStorage.setItem(
            CLAVE_ULTIMO_VIDEO,
            nombreVideo
          );
        } catch (error) {
          console.warn(
            "No fue posible guardar el último video."
          );
        }
      }

      /*
       * Usa todos los videos en orden aleatorio
       * antes de repetir alguno.
       */
      function obtenerSiguienteVideo() {
        const ultimoVideo =
          leerUltimoVideo();

        let cola =
          leerColaVideos().filter(
            (nombreVideo) =>
              VIDEOS_FONDO.includes(
                nombreVideo
              )
          );

        /*
         * Cuando termina la ronda,
         * mezcla nuevamente los seis archivos.
         */
        if (cola.length === 0) {
          cola =
            barajar(VIDEOS_FONDO);

          /*
           * Evita que la nueva ronda comience
           * con el último video de la anterior.
           */
          if (
            cola.length > 1 &&
            cola[0] === ultimoVideo
          ) {
            const indiceAlternativo =
              cola.findIndex(
                (nombreVideo) =>
                  nombreVideo !==
                  ultimoVideo
              );

            if (indiceAlternativo > 0) {
              [
                cola[0],
                cola[indiceAlternativo]
              ] = [
                cola[indiceAlternativo],
                cola[0]
              ];
            }
          }
        }

        const videoSeleccionado =
          cola.shift();

        guardarColaVideos(cola);

        guardarUltimoVideo(
          videoSeleccionado
        );

        return videoSeleccionado;
      }

      /*
       * ==========================================================
       * CARGA Y PREPARACIÓN DE VIDEO
       * ==========================================================
       */

      /*
       * Espera hasta que el navegador tenga al menos
       * un fotograma disponible.
       */
      function esperarVideoListo(
        video,
        tiempoMaximo =
          TIEMPO_MAXIMO_VIDEO
      ) {
        if (video.readyState >= 2) {
          return Promise.resolve();
        }

        return new Promise(
          (resolve, reject) => {
            let finalizado = false;

            const temporizador =
              setTimeout(() => {
                terminar(
                  new Error(
                    `Tiempo de carga agotado: ${video.src}`
                  )
                );
              }, tiempoMaximo);

            function limpiarEventos() {
              clearTimeout(
                temporizador
              );

              video.removeEventListener(
                "loadeddata",
                videoListo
              );

              video.removeEventListener(
                "canplay",
                videoListo
              );

              video.removeEventListener(
                "error",
                videoError
              );
            }

            function terminar(
              error = null
            ) {
              if (finalizado) {
                return;
              }

              finalizado = true;

              limpiarEventos();

              if (error) {
                reject(error);
              } else {
                resolve();
              }
            }

            function videoListo() {
              terminar();
            }

            function videoError() {
              terminar(
                new Error(
                  `No fue posible cargar: ${video.src}`
                )
              );
            }

            video.addEventListener(
              "loadeddata",
              videoListo
            );

            video.addEventListener(
              "canplay",
              videoListo
            );

            video.addEventListener(
              "error",
              videoError
            );
          }
        );
      }

      /*
       * Espera a que el video haya generado
       * un fotograma para mostrar.
       */
      function esperarPrimerFotograma(
        video,
        tiempoMaximo = 1500
      ) {
        return new Promise((resolve) => {
          let finalizado = false;

          const temporizador =
            setTimeout(
              finalizar,
              tiempoMaximo
            );

          function finalizar() {
            if (finalizado) {
              return;
            }

            finalizado = true;

            clearTimeout(
              temporizador
            );

            video.removeEventListener(
              "playing",
              finalizar
            );

            video.removeEventListener(
              "timeupdate",
              finalizar
            );

            resolve();
          }

          if (
            typeof video.requestVideoFrameCallback ===
            "function"
          ) {
            video.requestVideoFrameCallback(
              finalizar
            );
          } else {
            video.addEventListener(
              "playing",
              finalizar,
              { once: true }
            );

            video.addEventListener(
              "timeupdate",
              finalizar,
              { once: true }
            );
          }
        });
      }

      /*
       * Limpia solamente el reproductor oculto.
       */
      function limpiarVideo(video) {
        video.pause();

        video.classList.remove(
          "activo"
        );

        video.style.zIndex = "0";

        video.removeAttribute("src");

        video.removeAttribute(
          "data-archivo"
        );

        video.load();
      }

      /*
       * Carga un archivo en un reproductor
       * y espera hasta que esté preparado.
       */
      async function cargarArchivoVideo(
        video,
        nombreArchivo
      ) {
        video.pause();

        video.classList.remove(
          "activo"
        );

        video.style.zIndex = "0";

        video.src = nombreArchivo;

        video.dataset.archivo =
          nombreArchivo;

        video.load();

        await esperarVideoListo(video);

        try {
          video.currentTime = 0;
        } catch (error) {
          console.warn(
            "No fue posible colocar el video al inicio:",
            error
          );
        }
      }

      /*
       * Si un archivo presenta un error,
       * intenta cargar otro de la lista.
       */
      async function cargarSiguienteArchivoValido(
        video
      ) {
        let ultimoError = null;

        for (
          let intento = 0;
          intento < VIDEOS_FONDO.length;
          intento++
        ) {
          const archivo =
            obtenerSiguienteVideo();

          try {
            await cargarArchivoVideo(
              video,
              archivo
            );

            console.log(
              "Video cargado:",
              archivo
            );

            return archivo;
          } catch (error) {
            ultimoError = error;

            console.error(
              `No fue posible cargar ${archivo}:`,
              error
            );

            limpiarVideo(video);
          }
        }

        throw (
          ultimoError ||
          new Error(
            "No fue posible cargar ningún video."
          )
        );
      }

      /*
       * ==========================================================
       * DOBLE BÚFER DE VIDEO
       * ==========================================================
       */

      /*
       * Precarga el próximo archivo en el reproductor oculto.
       */
      async function prepararSiguienteVideo() {
        if (siguienteVideoPreparado) {
          return true;
        }

        if (promesaPreparacionVideo) {
          return promesaPreparacionVideo;
        }

        const indiceSiguiente =
          1 - indiceVideoActivo;

        const videoSiguiente =
          videosFondo[indiceSiguiente];

        promesaPreparacionVideo =
          (async () => {
            siguienteVideoPreparado =
              false;

            try {
              limpiarVideo(
                videoSiguiente
              );

              await cargarSiguienteArchivoValido(
                videoSiguiente
              );

              siguienteVideoPreparado =
                true;

              console.log(
                "Próximo video preparado:",
                videoSiguiente.dataset
                  .archivo
              );

              return true;
            } catch (error) {
              siguienteVideoPreparado =
                false;

              console.error(
                "No fue posible preparar el próximo video:",
                error
              );

              return false;
            } finally {
              promesaPreparacionVideo =
                null;
            }
          })();

        return promesaPreparacionVideo;
      }

      /*
       * Inicia el primer video visible y empieza
       * a precargar el segundo.
       */
      async function iniciarSistemaVideos() {
        if (sistemaVideosIniciado) {
          return;
        }

        sistemaVideosIniciado = true;

        const videoInicial =
          videosFondo[indiceVideoActivo];

        try {
          limpiarVideo(videoInicial);

          await cargarSiguienteArchivoValido(
            videoInicial
          );

          videoInicial.style.zIndex =
            "2";

          const primerFotograma =
            esperarPrimerFotograma(
              videoInicial
            );

          await videoInicial.play();

          await primerFotograma;

          videoInicial.classList.add(
            "activo"
          );

          console.log(
            "Video inicial activo:",
            videoInicial.dataset.archivo
          );

          /*
           * El segundo archivo comienza a cargarse
           * inmediatamente en segundo plano.
           */
          prepararSiguienteVideo();
        } catch (error) {
          sistemaVideosIniciado =
            false;

          console.error(
            "No fue posible iniciar los videos:",
            error
          );
        }
      }

      /*
       * Cambia al reproductor que ya tiene
       * el próximo archivo precargado.
       */
      async function cambiarAlSiguienteVideo() {
        if (
          cambioVideoEnCurso ||
          !sistemaVideosIniciado
        ) {
          return;
        }

        cambioVideoEnCurso = true;

        const indiceAnterior =
          indiceVideoActivo;

        const indiceSiguiente =
          1 - indiceVideoActivo;

        const videoAnterior =
          videosFondo[indiceAnterior];

        const videoSiguiente =
          videosFondo[indiceSiguiente];

        try {
          /*
           * Normalmente el siguiente archivo ya estará listo.
           * Si no, espera a que termine su precarga.
           */
          if (!siguienteVideoPreparado) {
            await prepararSiguienteVideo();
          }

          if (!siguienteVideoPreparado) {
            throw new Error(
              "El próximo video no está preparado."
            );
          }

          try {
            videoSiguiente.currentTime =
              0;
          } catch (error) {
            console.warn(
              "No fue posible reiniciar el video preparado:",
              error
            );
          }

          /*
           * El siguiente video queda por encima.
           */
          videoAnterior.style.zIndex =
            "1";

          videoSiguiente.style.zIndex =
            "2";

          const primerFotograma =
            esperarPrimerFotograma(
              videoSiguiente
            );

          await videoSiguiente.play();

          /*
           * Mantiene visible el anterior hasta que
           * el nuevo tenga un fotograma real.
           */
          await primerFotograma;

          videoSiguiente.classList.add(
            "activo"
          );

          requestAnimationFrame(() => {
            videoAnterior.classList.remove(
              "activo"
            );
          });

          await esperar(
            DURACION_FUNDIDO_MS + 80
          );

          /*
           * El anterior se elimina únicamente después
           * de quedar completamente oculto.
           */
          videoAnterior.pause();

          indiceVideoActivo =
            indiceSiguiente;

          siguienteVideoPreparado =
            false;

          console.log(
            "Video activo:",
            videoSiguiente.dataset.archivo
          );

          limpiarVideo(
            videoAnterior
          );

          /*
           * Precarga el próximo archivo en el
           * reproductor que acaba de quedar libre.
           */
          prepararSiguienteVideo();
        } catch (error) {
          console.error(
            "No fue posible cambiar de video:",
            error
          );

          /*
           * Mantiene el video anterior visible
           * para evitar una pantalla negra.
           */
          videoAnterior.style.zIndex =
            "2";

          videoAnterior.classList.add(
            "activo"
          );

          videoSiguiente.classList.remove(
            "activo"
          );

          videoSiguiente.style.zIndex =
            "0";

          try {
            videoAnterior.currentTime = 0;

            await videoAnterior.play();
          } catch (errorReinicio) {
            console.error(
              "No fue posible reiniciar el video anterior:",
              errorReinicio
            );
          }

          siguienteVideoPreparado =
            false;

          prepararSiguienteVideo();
        } finally {
          cambioVideoEnCurso = false;
        }
      }

      /*
       * ==========================================================
       * EVENTOS DE VIDEO
       * ==========================================================
       */

      videosFondo.forEach(
        (video, indice) => {
          /*
           * Cambia antes de llegar al final exacto.
           */
          video.addEventListener(
            "timeupdate",
            () => {
              if (
                indice !==
                  indiceVideoActivo ||
                cambioVideoEnCurso ||
                !Number.isFinite(
                  video.duration
                ) ||
                video.duration <= 0
              ) {
                return;
              }

              const tiempoRestante =
                video.duration -
                video.currentTime;

              if (
                tiempoRestante <=
                MARGEN_CAMBIO_SEGUNDOS
              ) {
                cambiarAlSiguienteVideo();
              }
            }
          );

          /*
           * Respaldo si timeupdate no alcanza
           * a ejecutarse antes del final.
           */
          video.addEventListener(
            "ended",
            () => {
              if (
                indice ===
                indiceVideoActivo
              ) {
                cambiarAlSiguienteVideo();
              }
            }
          );

          video.addEventListener(
            "error",
            () => {
              console.error(
                "Error en el reproductor:",
                video.dataset.archivo ||
                  video.src
              );

              if (
                indice ===
                indiceVideoActivo
              ) {
                cambiarAlSiguienteVideo();
              }
            }
          );
        }
      );

      /*
       * ==========================================================
       * EVENTOS GENERALES
       * ==========================================================
       */

      window.addEventListener(
        "resize",
        ajustarLienzo
      );

      /*
       * Cuando la creatividad deja de estar visible,
       * pausa ambos reproductores.
       *
       * Cuando vuelve a aparecer, utiliza el video
       * siguiente que ya estaba precargado.
       */
      document.addEventListener(
        "visibilitychange",
        () => {
          if (document.hidden) {
            videosFondo.forEach(
              (video) => {
                video.pause();
              }
            );

            return;
          }

          if (!sistemaVideosIniciado) {
            iniciarSistemaVideos();

            return;
          }

          cambiarAlSiguienteVideo();
        }
      );

      /*
       * Manejo para páginas recuperadas desde la caché.
       */
      window.addEventListener(
        "pageshow",
        (evento) => {
          if (!sistemaVideosIniciado) {
            iniciarSistemaVideos();
          } else if (evento.persisted) {
            cambiarAlSiguienteVideo();
          }
        }
      );

      /*
       * ==========================================================
       * INICIALIZACIÓN
       * ==========================================================
       */

      ajustarLienzo();

      /*
       * Muestra inmediatamente la última información válida guardada.
       * Después realiza una actualización silenciosa desde Google.
       */
      const registrosCacheInicial =
        cargarFrasesDesdeCache();

      if (
        registrosCacheInicial.length > 0
      ) {
        registros =
          registrosCacheInicial;

        mostrarFraseAleatoria();

        ocultarEstado();
      }

      cargarDatos(
        registros.length === 0
      );

      /*
       * Primera selección aleatoria de fondo.
       */
      iniciarSistemaVideos();

      /*
       * Cambia solamente la frase cada 5 segundos.
       *
       * No vuelve a consultar Google en cada cambio.
       */
      setInterval(
        mostrarFraseAleatoria,
        INTERVALO_FRASES
      );

      /*
       * Actualiza la base de frases cada 5 minutos.
       */
      setInterval(
        () => cargarDatos(false),
        INTERVALO_ACTUALIZACION_DATOS
      );
    </script>
  </body>
</html>
